[project]
name = "pacman"
version = "0.1.0"
description = "Original Pacman Simulated"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce",
    "flake8",
    "mypy",
    "mazegenerator",
    "pydantic>=2.13.4",
    "pyinstaller>=6.22.2",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
exclude = ["^tests_local/", "^build/", "^dist/"]

[[tool.mypy.overrides]]
module = ["mazegenerator", "mazegenerator.*"]
ignore_missing_imports = true

[tool.uv.sources]
mazegenerator = { path = "data/external_libraries/mazegenerator-2.1.0-py3-none-any.whl" }
