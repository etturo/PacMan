name: Build executables
on:
  push:
  workflow_dispatch:
jobs:
  build:
    name: Build ${{ matrix.platform }} executable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            artifact_path: dist/Pacman
            artifact_name: Pacman-linux
          - platform: windows
            os: windows-latest
            artifact_path: dist/Pacman.exe
            artifact_name: Pacman-windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install project dependencies
        run: uv sync --frozen
      - name: Build executable from the checked-in spec
        run: uv run pyinstaller --clean Pacman.spec
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error